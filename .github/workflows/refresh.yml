name: Refresh NBA Edge data
on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check NBA scoreboard feed
        run: python -c "from nba_api.live.nba.endpoints import scoreboard; print(len(scoreboard.ScoreBoard(timeout=20).get_dict().get('scoreboard',{}).get('games',[])))"
